<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SNIG - POS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/switch.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/accessibility.css') }}">
    <style>
        body { background: var(--color-bg); color: var(--color-text); }
        .pos-shell { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 0.9fr); gap: 1.5rem; margin-top: 2rem; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .product-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 0.9rem; display: flex; flex-direction: column; gap: 0.75rem; box-shadow: var(--shadow-sm); }
        .product-cover { display: flex; align-items: center; justify-content: center; min-height: 120px; border-radius: var(--radius-md); background: linear-gradient(135deg, rgba(29,78,216,0.12), rgba(34,197,94,0.12)); font-size: 2.5rem; font-weight: 700; }
        .product-meta { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
        .stock-badge { background: var(--color-success-soft); color: var(--color-success); border-radius: 999px; padding: 0.2rem 0.5rem; font-size: 0.7rem; font-weight: 700; }
        .cart-items { display: grid; gap: 0.8rem; margin-top: 1rem; }
        .cart-item { display: flex; justify-content: space-between; gap: 0.75rem; align-items: center; padding: 0.75rem; border: 1px solid var(--color-border); background: var(--color-surface-alt); border-radius: var(--radius-md); }
        .mini-controls { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.3rem; }
        .mini-controls button { width: 28px; height: 28px; min-height: 28px; padding: 0; }
        .payment-methods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.7rem; margin-top: 1rem; }
        .payment-method { border: 1px solid var(--color-border); background: var(--color-surface-alt); border-radius: var(--radius-md); padding: 0.7rem 0.5rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
        .payment-method.active { background: var(--color-primary-soft); border-color: var(--color-primary); color: var(--color-primary-hover); }
        .totals { display: grid; gap: 0.5rem; margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid var(--color-border); }
        .totals-row { display: flex; justify-content: space-between; font-weight: 600; }
        .total-final { font-size: 1.7rem; font-weight: 800; color: var(--color-primary); font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
    <nav aria-label="Navegación principal">
        <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
            <a href="/">🏠 Inicio</a>
            <a href="/inventario">📦 Inventario</a>
            <a href="/pos">🛒 POS</a>
            <a href="/reportes">📊 Reportes</a>
        </div>
        <div class="theme-switch-wrapper">
            <label class="switch" for="theme-switch">
                <input type="checkbox" id="theme-switch" aria-label="Activar modo oscuro" />
                <div class="sunmoon"><div class="darkside"></div></div>
                <div class="border"></div>
                <div class="clouds">
                    <img src="{{ url_for('static', filename='img/cloud_1.svg') }}" alt="" class="cloud cloud-1" />
                    <img src="{{ url_for('static', filename='img/cloud_2.svg') }}" alt="" class="cloud cloud-2" />
                    <img src="{{ url_for('static', filename='img/cloud_3.svg') }}" alt="" class="cloud cloud-3" />
                    <img src="{{ url_for('static', filename='img/cloud_4.svg') }}" alt="" class="cloud cloud-4" />
                    <img src="{{ url_for('static', filename='img/stars.svg') }}" alt="" class="stars" />
                </div>
            </label>
        </div>
    </nav>

    <main class="container pos-shell" id="main-content">
        <section class="panel" aria-labelledby="pos-catalog-title">
            <div class="panel-head">
                <h1 id="pos-catalog-title" style="margin:0;">🛒 Punto de venta</h1>
                <button class="btn" type="button" onclick="location.href='/'">⬅️ Inicio</button>
            </div>

            <div class="search-box" role="search">
                <label class="visually-hidden" for="catalog-search">Buscar producto</label>
                <input id="catalog-search" type="text" placeholder="Busca por nombre o GTIN..." />
                <button type="button" id="btn-buscar-producto">Buscar</button>
            </div>

            <div id="pos-feedback" class="pos-feedback" role="status" aria-live="polite"></div>
            <div id="product-grid" class="product-grid"></div>
        </section>

        <aside class="panel" aria-labelledby="cart-title">
            <div class="panel-head">
                <h2 id="cart-title" style="margin:0;">Carrito</h2>
                <button class="btn btn-danger" type="button" id="btn-vaciar">Vaciar</button>
            </div>

            <div id="cart-items" class="cart-items" aria-live="polite"></div>

            <div class="payment-methods" aria-label="Métodos de pago">
                <button class="payment-method active" type="button" data-method="efectivo">Efectivo</button>
                <button class="payment-method" type="button" data-method="transferencia">Transferencia</button>
            </div>

            <div class="totals">
                <div class="totals-row"><span>Subtotal</span><span id="subtotal">$0</span></div>
                <div class="totals-row"><span>Descuento</span><span id="descuento">$0</span></div>
                <div class="totals-row total-final"><span>Total</span><span id="total">$0</span></div>
            </div>

            <button class="btn btn-success" type="button" id="btn-checkout" style="width:100%; margin-top:1rem;">💳 Procesar venta</button>
        </aside>
    </main>

    <script>
        const themeSwitch = document.getElementById('theme-switch');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
            if (themeSwitch) themeSwitch.checked = true;
        }
        if (themeSwitch) {
            themeSwitch.addEventListener('change', function (event) {
                const isDark = event.target.checked;
                document.body.classList.toggle('dark', isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
        }

        let carrito = [];
        let metodoPago = 'efectivo';

        function setFeedback(message, isError = false) {
            const el = document.getElementById('pos-feedback');
            el.textContent = message;
            el.style.color = isError ? '#b91c1c' : '#166534';
        }

        function formatCurrency(value) {
            return '$' + Number(value || 0).toLocaleString('es-CO');
        }

        function renderCart() {
            const cart = document.getElementById('cart-items');
            if (!carrito.length) {
                cart.innerHTML = '<div class="empty-cart">Carrito vacío</div>';
                document.getElementById('subtotal').textContent = '$0';
                document.getElementById('descuento').textContent = '$0';
                document.getElementById('total').textContent = '$0';
                return;
            }

            const subtotal = carrito.reduce((sum, item) => sum + (item.cantidad * item.precio_venta), 0);
            const descuento = carrito.reduce((sum, item) => sum + (item.cantidad * item.precio_venta * (item.descuento || 0) / 100), 0);
            const total = subtotal - descuento;

            cart.innerHTML = carrito.map((item) => `
                <div class="cart-item">
                    <div>
                        <strong>${item.nombre}</strong><br>
                        <small>${item.presentacion}</small>
                        <div class="mini-controls">
                            <button type="button" data-action="decrease" data-id="${item.presentacion_id}">−</button>
                            <span>${item.cantidad}</span>
                            <button type="button" data-action="increase" data-id="${item.presentacion_id}">+</button>
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <div>${formatCurrency(item.cantidad * item.precio_venta)}</div>
                        <button type="button" class="btn btn-danger" data-action="remove" data-id="${item.presentacion_id}" style="margin-top:.4rem;">Quitar</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('subtotal').textContent = formatCurrency(subtotal);
            document.getElementById('descuento').textContent = formatCurrency(descuento);
            document.getElementById('total').textContent = formatCurrency(total);
        }

        function addCartItem(item) {
            const existing = carrito.find((x) => x.presentacion_id === item.presentacion_id);
            if (existing) {
                existing.cantidad += 1;
            } else {
                carrito.push({ ...item, cantidad: 1, descuento: 0 });
            }
            renderCart();
            setFeedback(`${item.nombre} agregado al carrito.`);
        }

        function changeCartQuantity(id, delta) {
            const item = carrito.find((x) => x.presentacion_id === id);
            if (!item) return;
            item.cantidad += delta;
            if (item.cantidad <= 0) {
                carrito = carrito.filter((x) => x.presentacion_id !== id);
            }
            renderCart();
        }

        async function cargarProductos() {
            const query = document.getElementById('catalog-search').value.trim().toLowerCase();
            try {
                const response = await fetch('/api/productos');
                const data = await response.json();
                const productos = Array.isArray(data) ? data : (data.items || []);
                const filtrados = productos.filter((producto) => {
                    if (!query) return true;
                    const hayGtIn = (producto.gtin || '').toLowerCase().includes(query);
                    const hayNombre = (producto.nombre || '').toLowerCase().includes(query);
                    const hayLaboratorio = (producto.laboratorio || '').toLowerCase().includes(query);
                    return hayGtIn || hayNombre || hayLaboratorio;
                });

                const grid = document.getElementById('product-grid');
                if (!filtrados.length) {
                    grid.innerHTML = '<div class="empty-cart">No hay productos para mostrar.</div>';
                    return;
                }

                grid.innerHTML = filtrados.map((producto) => {
                    const first = producto.presentaciones && producto.presentaciones[0] ? producto.presentaciones[0] : null;
                    const precio = first ? Number(first.precio_venta || 0) : 0;
                    const stock = first ? Number(first.stock || 0) : 0;
                    const icon = ['🥤', '🍎', '🥪', '🥛', '🧃', '🍇'][Math.abs((producto.gtin || '').length) % 6];
                    const prodData = JSON.stringify({
                        id: producto.id,
                        nombre: producto.nombre,
                        gtin: producto.gtin,
                        presentacion_id: first ? first.id : null,
                        presentacion: first ? first.tipo : 'unidad',
                        precio_venta: precio,
                        stock: stock,
                    }).replace(/'/g, '&apos;');
                    return `
                        <article class="product-card">
                            <div class="product-cover">${icon}</div>
                            <div>
                                <div class="product-meta">
                                    <strong>${producto.nombre || 'Producto'}</strong>
                                    <span class="stock-badge">${stock} un.</span>
                                </div>
                                <p class="muted" style="margin:0.4rem 0 0;">${producto.gtin || ''}</p>
                                <p class="muted" style="margin:0.3rem 0 0;">${first ? first.tipo : 'unidad'}</p>
                            </div>
                            <div class="product-meta">
                                <strong>${formatCurrency(precio)}</strong>
                                <button class="btn btn-primary" type="button" data-product='${prodData}'>Agregar</button>
                            </div>
                        </article>
                    `;
                }).join('');

                grid.querySelectorAll('button[data-product]').forEach((button) => {
                    button.addEventListener('click', () => {
                        const product = JSON.parse(button.getAttribute('data-product').replace(/&apos;/g, "'"));
                        if (!product.presentacion_id) {
                            setFeedback('Este producto no tiene presentación disponible.', true);
                            return;
                        }
                        addCartItem({
                            producto_id: product.id,
                            presentacion_id: product.presentacion_id,
                            nombre: product.nombre,
                            presentacion: product.presentacion,
                            precio_venta: product.precio_venta,
                            stock: product.stock,
                            descuento: 0,
                        });
                    });
                });
            } catch (error) {
                console.error(error);
                setFeedback('No se pudo cargar la lista de productos.', true);
            }
        }

        document.getElementById('btn-buscar-producto').addEventListener('click', cargarProductos);
        document.getElementById('catalog-search').addEventListener('input', () => {
            if (!document.getElementById('catalog-search').value.trim()) {
                cargarProductos();
            }
        });

        document.getElementById('btn-vaciar').addEventListener('click', () => {
            carrito = [];
            renderCart();
            setFeedback('Carrito vaciado.');
        });

        document.getElementById('cart-items').addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (!button) return;
            const action = button.dataset.action;
            const id = Number(button.dataset.id);
            if (action === 'increase') changeCartQuantity(id, 1);
            if (action === 'decrease') changeCartQuantity(id, -1);
            if (action === 'remove') changeCartQuantity(id, -999);
        });

        document.querySelectorAll('.payment-method').forEach((button) => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.payment-method').forEach((el) => el.classList.remove('active'));
                button.classList.add('active');
                metodoPago = button.dataset.method;
            });
        });

        document.getElementById('btn-checkout').addEventListener('click', async () => {
            if (!carrito.length) {
                setFeedback('El carrito está vacío.', true);
                return;
            }
            try {
                const response = await fetch('/api/ventas/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        metodo_pago: metodoPago,
                        usuario: 'cajero',
                        items: carrito.map((item) => ({
                            producto_id: item.producto_id,
                            presentacion_id: item.presentacion_id,
                            cantidad: item.cantidad,
                            precio_unitario: item.precio_venta,
                            descuento: item.descuento || 0,
                            producto_nombre: item.nombre,
                            presentacion_nombre: item.presentacion,
                        }))
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'No se pudo procesar la venta');
                }
                setFeedback(`Venta registrada: ${data.ticket} · ${formatCurrency(data.total)}`);
                carrito = [];
                renderCart();
            } catch (error) {
                setFeedback(error.message || 'Error al procesar la venta.', true);
            }
        });

        renderCart();
        cargarProductos();
    </script>
</body>
</html>
