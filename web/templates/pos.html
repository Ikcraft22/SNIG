<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        
        .panel {
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #38a169;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #38a169;
            padding-bottom: 1rem;
        }
        
        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .search-box input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        .search-box button {
            padding: 0.75rem 1.5rem;
            background: #38a169;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: #f7f7f7;
            font-weight: bold;
            color: #38a169;
        }
        
        .resumen {
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 5px;
            margin: 1rem 0;
        }
        
        .resumen-fila {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 1.1rem;
        }
        
        .resumen-total {
            font-weight: bold;
            font-size: 1.5rem;
            color: #38a169;
            border-top: 2px solid #38a169;
            margin-top: 1rem;
            padding-top: 1rem;
        }
        
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #38a169;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            transition: background 0.3s;
            margin: 0.5rem;
        }
        
        .btn:hover {
            background: #2f855a;
        }
        
        .btn-danger {
            background: #f56565;
        }
        
        .btn-danger:hover {
            background: #e53e3e;
        }
        
        .btn-primary {
            background: #48bb78;
        }
        
        .btn-primary:hover {
            background: #38a169;
        }
        
        .empty-cart {
            text-align: center;
            color: #999;
            padding: 2rem;
        }
    <link rel="stylesheet" href="/static/css/switch.css">
</head>
<body>
    <div style="max-width: 1400px; margin: 0 auto 1.5rem auto; display: flex; justify-content: flex-end; align-items: center; gap: 1.5rem;">
        <label class="switch" for="theme-switch" title="Cambiar modo claro / oscuro">
            <input type="checkbox" id="theme-switch" />
            <div class="sunmoon">
                <div class="darkside"></div>
            </div>
            <div class="border"></div>
            <div class="clouds">
                <img src="/static/img/cloud_1.svg" alt="" class="cloud cloud-1" />
                <img src="/static/img/cloud_2.svg" alt="" class="cloud cloud-2" />
                <img src="/static/img/cloud_3.svg" alt="" class="cloud cloud-3" />
                <img src="/static/img/cloud_4.svg" alt="" class="cloud cloud-4" />
                <img src="/static/img/stars.svg" alt="" class="stars" />
            </div>
        </label>
        <button class="btn" style="margin: 0;" onclick="location.href='/'">⬅️ Volver al Inicio</button>
    </div>
    <div class="container">
        <!-- Panel Izquierdo: Búsqueda de Productos -->
        <div class="panel">
            <h1>🛍️ Agregar Productos</h1>
            
            <div class="search-box">
                <input type="text" id="gtin-input" placeholder="Escanea GTIN..." autofocus>
                <button onclick="agregarCarrito()">➕ Agregar</button>
            </div>
            
            <div id="producto-info" style="display: none; background: #f0f0f0; padding: 1rem; border-radius: 5px; margin-bottom: 1rem;">
                <p><strong>Nombre:</strong> <span id="producto-nombre"></span></p>
                <p><strong>Presentación:</strong> <span id="producto-presentacion"></span></p>
                <p><strong>Precio:</strong> <span id="producto-precio"></span></p>
                <p><strong>Stock:</strong> <span id="producto-stock"></span></p>
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label>Cantidad: </label>
                <input type="number" id="cantidad-input" value="1" min="1">
            </div>
            
            <button class="btn btn-primary" onclick="agregarCarrito()">➕ Agregar al Carrito</button>
        </div>
        
        <!-- Panel Derecho: Carrito -->
        <div class="panel">
            <h1>🛒 Carrito</h1>
            
            <table id="carrito-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Subtotal</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="carrito-body">
                </tbody>
            </table>
            
            <div id="carrito-vacio" class="empty-cart">
                🛒 Carrito vacío
            </div>
            
            <div class="resumen">
                <div class="resumen-fila">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="resumen-total">
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </div>
            </div>
            
            <button class="btn btn-danger" onclick="vaciarCarrito()" id="btn-vaciar">🗑️ Vaciar Carrito</button>
            <button class="btn btn-primary" onclick="procesarPago()" id="btn-pagar" style="width: calc(100% - 10rem);">💳 Procesar Pago</button>
        </div>
    </div>
    
    <script>
        let carrito = [];
        
        function buscarProducto() {
            const gtin = document.getElementById('gtin-input').value.trim();
            
            if (!gtin) return;
            
            fetch(`/api/productos/${gtin}`)
                .then(response => response.json())
                .then(producto => {
                    if (producto.presentaciones && producto.presentaciones.length > 0) {
                        const pres = producto.presentaciones[0];
                        document.getElementById('producto-nombre').textContent = producto.nombre;
                        document.getElementById('producto-presentacion').textContent = pres.tipo;
                        document.getElementById('producto-precio').textContent = `$${pres.precio_venta.toFixed(2)}`;
                        document.getElementById('producto-stock').textContent = pres.stock;
                        document.getElementById('producto-info').style.display = 'block';
                    }
                })
                .catch(error => alert('Error: ' + error.message));
        }
        
        function agregarCarrito() {
            const gtin = document.getElementById('gtin-input').value.trim();
            const cantidad = parseInt(document.getElementById('cantidad-input').value) || 1;
            
            if (!gtin) {
                alert('Ingresa un GTIN');
                return;
            }
            
            fetch(`/api/productos/${gtin}`)
                .then(response => response.json())
                .then(producto => {
                    if (producto.presentaciones && producto.presentaciones.length > 0) {
                        const pres = producto.presentaciones[0];
                        
                        carrito.push({
                            producto: producto.nombre,
                            presentacion: pres.tipo,
                            cantidad: cantidad,
                            precio: pres.precio_venta,
                            subtotal: cantidad * pres.precio_venta
                        });
                        
                        actualizarCarrito();
                        document.getElementById('gtin-input').value = '';
                        document.getElementById('cantidad-input').value = '1';
                        document.getElementById('producto-info').style.display = 'none';
                    }
                })
                .catch(error => alert('Error: ' + error.message));
        }
        
        function actualizarCarrito() {
            const tbody = document.getElementById('carrito-body');
            tbody.innerHTML = '';
            
            let subtotal = 0;
            
            carrito.forEach((item, index) => {
                subtotal += item.subtotal;
                const fila = `
                    <tr>
                        <td>${item.producto}</td>
                        <td>${item.cantidad}</td>
                        <td>$${item.precio.toFixed(2)}</td>
                        <td>$${item.subtotal.toFixed(2)}</td>
                        <td><button class="btn btn-danger" onclick="eliminarDelCarrito(${index})">🗑️</button></td>
                    </tr>
                `;
                tbody.innerHTML += fila;
            });
            
            const total = subtotal;
            
            document.getElementById('carrito-table').style.display = carrito.length > 0 ? 'table' : 'none';
            document.getElementById('carrito-vacio').style.display = carrito.length > 0 ? 'none' : 'block';
            document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('total').textContent = `$${total.toFixed(2)}`;
            document.getElementById('btn-vaciar').disabled = carrito.length === 0;
            document.getElementById('btn-pagar').disabled = carrito.length === 0;
        }
        
        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarrito();
        }
        
        function vaciarCarrito() {
            carrito = [];
            actualizarCarrito();
        }
        
        function procesarPago() {
            alert('Funcionalidad de pago en desarrollo');
        }
        
        document.getElementById('gtin-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                buscarProducto();
            }
        });
        
        // Inicializar carrito
        actualizarCarrito();

        const themeSwitch = document.getElementById('theme-switch');
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.body.classList.add('dark');
            if (themeSwitch) themeSwitch.checked = true;
        }
        if (themeSwitch) {
            themeSwitch.addEventListener('change', function(e) {
                if (e.target.checked) {
                    document.body.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.body.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            });
        }
    </script>
</body>
</html>
