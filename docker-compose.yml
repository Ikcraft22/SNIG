services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema_inventario_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - DEBUG=False
      - SYNC_API_TOKEN=${SYNC_API_TOKEN:-}
      - SYNC_NODO_ID=${SYNC_NODO_ID:-nodo-principal}
    volumes:
      - inventario_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/productos')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  inventario_data:
